[project]
name = "guardrail-sdk"
version = "0.1.0"
description = "Client SDK and LangChain integration for the Guardrail Gateway."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
langchain = [
    "langchain>=1.4",
    "langchain-core>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_sdk"]
