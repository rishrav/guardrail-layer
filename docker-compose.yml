name: guardrail

x-gateway-base: &gateway-base
  build:
    context: .
    dockerfile: gateway/Dockerfile
  image: guardrail-gateway:dev
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-guardrail}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-guardrail}
    REDIS_URL: redis://redis:6379/0
    GUARDRAIL_API_KEY: ${GUARDRAIL_API_KEY:-change-me-local-dev-key}
    GUARDRAIL_POLICY_PATH: /app/policies/default.yaml
    # macOS: Ollama runs natively on the host (Docker has no Metal GPU access).
    MODEL_BASE_URL: ${MODEL_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    INJECTION_MODEL_DIR: /app/models/weights/deberta-v3-prompt-injection-v2
    LLM_CLASSIFIER_ENABLED: ${LLM_CLASSIFIER_ENABLED:-true}
  volumes:
    - ./policies:/app/policies:ro
    - ./models:/app/models:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  migrate:
    <<: *gateway-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *gateway-base
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-guardrail}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
