[project]
name = "guardrail-layer"
version = "0.1.0"
description = "Automated guardrail layer for LLM agents: tool-call screening, injection detection, adjudication, audit."
requires-python = ">=3.12"
dependencies = ["guardrail-gateway", "guardrail-sdk[langchain]", "guardrail-agent-demo"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gateway", "sdk", "agent_demo"]

[tool.uv.sources]
guardrail-gateway = { workspace = true }
guardrail-sdk = { workspace = true }
guardrail-agent-demo = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Signature regexes read better unbroken than split mid-pattern.
"gateway/src/gateway/pipeline/heuristics.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "guardrail_sdk", "agent_demo", "benchmarks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Upstream starlette/fastapi TestClient deprecations; not actionable in this repo.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
