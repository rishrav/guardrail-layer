[project]
name = "guardrail-gateway"
version = "0.1.0"
description = "FastAPI gateway that screens LLM agent inputs, documents and tool calls."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
