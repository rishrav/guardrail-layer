[project]
name = "guardrail-gateway"
version = "0.1.0"
description = "FastAPI gateway that screens LLM agent inputs, documents and tool calls."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "tokenizers>=0.20",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
